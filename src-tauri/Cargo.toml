[package]
name = "bruma"
version = "0.1.2"
description = "Bruma: journal, todos, routines and device security checks"
authors = ["Gabriel A. Luis Freitas <gabiluisfreitas@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bruma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-os = "2"
regex = "1.10"
reqwest = { version = "0.11", features = ["json"] }
chrono = "0.4"
keyring = { version = "3.6.2", features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri-plugin-notification = "~2.2"
uuid = { version = "1.16", features = ["v4"] }
tokio = { version = "1", features = ["time"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "~2.4"
tauri-plugin-global-shortcut = "~2.2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"


[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
